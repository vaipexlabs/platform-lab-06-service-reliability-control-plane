name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands, contract, and evidence needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Go version, Docker version, and relevant logs with secrets removed.
    validations:
      required: true
