services:
  checkout-demo:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    ports:
      - "18080:8080"
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      - checkout-demo
    restart: unless-stopped
